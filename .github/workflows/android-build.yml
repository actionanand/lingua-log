name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main-android]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  MIN_SDK_VERSION: 24
  COMPILE_SDK_VERSION: 36
  TARGET_SDK_VERSION: 36
  RELEASE_BASENAME: lingua-log-release

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Verify Node.js version
        shell: bash
        run: |
          EXPECTED_NODE=$(tr -d '[:space:]' < .nvmrc)
          ACTUAL_NODE=$(node --version)
          test "$ACTUAL_NODE" = "v$EXPECTED_NODE"
          echo "Using Node.js $ACTUAL_NODE from .nvmrc"

      - name: Bump Android version code
        if: github.ref == 'refs/heads/main-android'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          node scripts/bump-android-version.js
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('./android-version.json').versionName")
          echo "Building versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          git pull --rebase --autostash
          git add android-version.json
          if git diff --cached --quiet; then
            echo "Android version is unchanged."
          else
            git commit -m "chore: bump Android versionCode to $VERSION_CODE [skip ci]"
            git push
          fi

      - name: Read Android version
        shell: bash
        run: |
          VERSION_CODE=$(node -p "require('./android-version.json').versionCode")
          VERSION_NAME=$(node -p "require('./android-version.json').versionName")
          VERSION_SUFFIX=${VERSION_NAME//./-}
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_FILE_BASENAME=${RELEASE_BASENAME}-${VERSION_SUFFIX}" >> "$GITHUB_ENV"
          echo "Using Android versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Install dependencies
        run: npm ci

      - name: Inject build environment
        env:
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}
        run: node scripts/inject-env.js

      - name: Build Angular application
        run: npm run build -- --configuration=production

      - name: Install Capacitor
        run: npm install --no-save --package-lock=false @capacitor/cli @capacitor/core @capacitor/android

      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Generate and synchronise Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Set up Java and Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 36 and matching Build Tools
        shell: bash
        run: |
          set -o pipefail
          if (( COMPILE_SDK_VERSION < TARGET_SDK_VERSION )); then
            echo "compileSdkVersion $COMPILE_SDK_VERSION cannot be lower than targetSdkVersion $TARGET_SDK_VERSION."
            exit 1
          fi

          BUILD_TOOLS_VERSION=$(
            sdkmanager --list |
              awk -v api="$COMPILE_SDK_VERSION" '
                $1 ~ /^build-tools;/ {
                  version = $1
                  sub(/^build-tools;/, "", version)
                  pattern = "^" api "\\.[0-9]+\\.[0-9]+$"
                  if (version ~ pattern) print version
                }
              ' |
              sort -Vu |
              tail -1
          )
          if [[ -z "$BUILD_TOOLS_VERSION" ]]; then
            echo "No stable Build Tools release matches compile SDK $COMPILE_SDK_VERSION."
            exit 1
          fi

          sdkmanager "platforms;android-$COMPILE_SDK_VERSION" "build-tools;$BUILD_TOOLS_VERSION"
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> "$GITHUB_ENV"
          echo "Installed Android API $COMPILE_SDK_VERSION with Build Tools $BUILD_TOOLS_VERSION"

      - name: Apply SDK and release versions
        working-directory: android/app
        shell: bash
        run: |
          sed -i 's/versionCode [0-9]*/versionCode project.hasProperty("versionCode") ? project.versionCode.toInteger() : 1/' build.gradle
          sed -i 's/versionName "[^"]*"/versionName project.hasProperty("versionName") ? project.versionName : "1.0.0"/' build.gradle
          sed -i "s/minSdkVersion = .*/minSdkVersion = $MIN_SDK_VERSION/" ../variables.gradle
          sed -i "s/compileSdkVersion = .*/compileSdkVersion = $COMPILE_SDK_VERSION/" ../variables.gradle
          sed -i "s/targetSdkVersion = .*/targetSdkVersion = $TARGET_SDK_VERSION/" ../variables.gradle
          if grep -Eq '^[[:space:]]*buildToolsVersion[[:space:]]' build.gradle; then
            sed -i "s/^[[:space:]]*buildToolsVersion[[:space:]].*/    buildToolsVersion \"$BUILD_TOOLS_VERSION\"/" build.gradle
          else
            sed -i "/^[[:space:]]*android[[:space:]]*{/a\\    buildToolsVersion \"$BUILD_TOOLS_VERSION\"" build.gradle
          fi
          grep -Fq 'project.hasProperty("versionCode")' build.gradle
          grep -Fq 'project.hasProperty("versionName")' build.gradle
          grep -Fq "minSdkVersion = $MIN_SDK_VERSION" ../variables.gradle
          grep -Fq "compileSdkVersion = $COMPILE_SDK_VERSION" ../variables.gradle
          grep -Fq "targetSdkVersion = $TARGET_SDK_VERSION" ../variables.gradle
          grep -Fq "buildToolsVersion \"$BUILD_TOOLS_VERSION\"" build.gradle
          echo "Applied versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "Applied minSdkVersion=$MIN_SDK_VERSION compileSdkVersion=$COMPILE_SDK_VERSION targetSdkVersion=$TARGET_SDK_VERSION buildToolsVersion=$BUILD_TOOLS_VERSION"

      - name: Patch Android shell, splash, and biometric security
        run: node scripts/patch-android-pip.mjs

      - name: Inject app icon
        shell: bash
        run: |
          mkdir -p releases
          ICON_SRC="public/lingua-log.png"
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          declare -A SIZES=(
            ["mipmap-mdpi"]=48
            ["mipmap-hdpi"]=72
            ["mipmap-xhdpi"]=96
            ["mipmap-xxhdpi"]=144
            ["mipmap-xxxhdpi"]=192
          )
          for DIR in "${!SIZES[@]}"; do
            SIZE=${SIZES[$DIR]}
            mkdir -p "android/app/src/main/res/$DIR"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              "android/app/src/main/res/$DIR/ic_launcher.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              "android/app/src/main/res/$DIR/ic_launcher_round.png"
            convert "$ICON_SRC" -resize "${SIZE}x${SIZE}" \
              "android/app/src/main/res/$DIR/ic_launcher_foreground.png"
          done
          convert "$ICON_SRC" -resize 512x512 releases/playstore-icon.png

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Clear previous repository release artifacts
        shell: bash
        run: |
          mkdir -p releases
          rm -f releases/*.apk releases/*.aab releases/*.apk.idsig releases/*-mapping.txt

      - name: Decode optional signing keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            if printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lingua-log-release.jks"; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "Signing credentials found. Signed APK and AAB files will be built."
            else
              rm -f "$RUNNER_TEMP/lingua-log-release.jks"
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Keystore decoding failed. Unsigned release files will be built."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Keystore, store password, or alias is missing. Unsigned release files will be built."
          fi

      - name: Detect keystore type
        id: keystore_type
        if: steps.keystore.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          DETECTION=$(node scripts/detect-keystore-format.mjs "$RUNNER_TEMP/lingua-log-release.jks")
          echo "$DETECTION"
          KEYSTORE_TYPE=$(printf '%s\n' "$DETECTION" | awk -F': ' '/Keystore type:/ { print toupper($2); exit }')
          test -n "$KEYSTORE_TYPE"
          test "$KEYSTORE_TYPE" != "UNKNOWN"
          echo "type=$KEYSTORE_TYPE" >> "$GITHUB_OUTPUT"
          echo "Detected keystore type: $KEYSTORE_TYPE"

      - name: Build release APK and AAB
        working-directory: android
        shell: bash
        env:
          CAN_SIGN: ${{ steps.keystore.outputs.available == 'true' && steps.keystore_type.outcome == 'success' }}
          KEYSTORE_TYPE: ${{ steps.keystore_type.outputs.type }}
          KEYSTORE_PATH: ${{ runner.temp }}/lingua-log-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          BASE_GRADLE_ARGS=(
            assembleRelease
            bundleRelease
            --no-daemon
            "-PversionCode=$VERSION_CODE"
            "-PversionName=$VERSION_NAME"
          )

          SIGNED_BUILD=false
          if [[ "$CAN_SIGN" == "true" ]]; then
            EFFECTIVE_KEY_PASSWORD="$KEY_PASSWORD"
            if [[ "$KEYSTORE_TYPE" == "PKCS12" ]]; then
              EFFECTIVE_KEY_PASSWORD="$KEYSTORE_PASSWORD"
              echo "PKCS12 detected; using the keystore password for private-key decryption."
            fi

            SIGNING_ARGS=(
              "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH"
              "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$EFFECTIVE_KEY_PASSWORD"
            )

            if ./gradlew "${BASE_GRADLE_ARGS[@]}" "${SIGNING_ARGS[@]}"; then
              SIGNED_BUILD=true
            else
              echo "Signing failed. Rebuilding unsigned APK and AAB artifacts."
              ./gradlew clean --no-daemon
              ./gradlew "${BASE_GRADLE_ARGS[@]}"
            fi
          else
            echo "A readable signing keystore is unavailable. Building unsigned artifacts."
            ./gradlew "${BASE_GRADLE_ARGS[@]}"
          fi

          echo "SIGNED_BUILD=$SIGNED_BUILD" >> "$GITHUB_ENV"

      - name: Copy Android artifacts to releases
        shell: bash
        run: |
          APK_SOURCE=$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -1)
          AAB_SOURCE=$(find android/app/build/outputs/bundle/release -type f -name '*.aab' | head -1)
          test -s "$APK_SOURCE"
          test -s "$AAB_SOURCE"
          if [[ "$SIGNED_BUILD" == "true" ]]; then
            APK_TARGET="releases/${RELEASE_FILE_BASENAME}.apk"
            AAB_TARGET="releases/${RELEASE_FILE_BASENAME}.aab"
            APK_STATUS="SIGNED APK created: $APK_TARGET"
            AAB_STATUS="SIGNED AAB created: $AAB_TARGET"
          else
            APK_TARGET="releases/${RELEASE_FILE_BASENAME}-unsigned.apk"
            AAB_TARGET="releases/${RELEASE_FILE_BASENAME}-unsigned.aab"
            APK_STATUS="UNSIGNED APK created: $APK_TARGET"
            AAB_STATUS="UNSIGNED AAB created: $AAB_TARGET"
          fi
          cp "$APK_SOURCE" "$APK_TARGET"
          cp "$AAB_SOURCE" "$AAB_TARGET"
          echo "APK_TARGET=$APK_TARGET" >> "$GITHUB_ENV"
          echo "AAB_TARGET=$AAB_TARGET" >> "$GITHUB_ENV"
          echo "APK_STATUS=$APK_STATUS" >> "$GITHUB_ENV"
          echo "AAB_STATUS=$AAB_STATUS" >> "$GITHUB_ENV"
          echo "$APK_STATUS"
          echo "$AAB_STATUS"

      - name: Summarize Android artifacts
        shell: bash
        run: |
          test -s "$APK_TARGET"
          test -s "$AAB_TARGET"
          echo "Android artifact summary"
          echo "$APK_STATUS"
          echo "$AAB_STATUS"
          {
            echo "## Android release $VERSION_NAME ($VERSION_CODE)"
            echo "- $APK_STATUS"
            echo "- $AAB_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh releases/

      - name: Commit versioned Android artifacts to main-android
        if: github.ref == 'refs/heads/main-android'
        shell: bash
        run: |
          test -s "$APK_TARGET"
          test -s "$AAB_TARGET"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash
          git add releases/
          if git diff --cached --quiet; then
            echo "Release files are unchanged; no release commit is needed."
          else
            git commit -m "build: add LinguaLog Android $VERSION_NAME ($VERSION_CODE) [skip ci]"
            git push
            echo "APK and AAB committed to main-android/releases."
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lingua-log-android-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            releases/*.apk
            releases/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach files to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            releases/*.apk
            releases/*.aab
          generate_release_notes: true

      - name: Remove decoded signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lingua-log-release.jks"
