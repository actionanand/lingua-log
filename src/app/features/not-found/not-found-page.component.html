<section class="not-found" aria-labelledby="not-found-title">
  <div class="orbit" aria-hidden="true">
    <span>தமிழ்</span>
    <span>English</span>
    <span>हिन्दी</span>
  </div>

  <div class="not-found-copy">
    <p class="eyebrow">404</p>
    <h1 id="not-found-title">This page is not available here</h1>
    <p>
      Protected tools stay hidden until login. You can return to the public language log or unlock
      the editor tools.
    </p>

    <div class="actions">
      <a class="secondary-button" routerLink="/logs">Go to logs</a>

      @if (!authService.isLoggedIn()) {
        <button type="button" class="primary-button" (click)="openLogin()">
          <span class="material-symbols-rounded" aria-hidden="true">login</span>
          Log in
        </button>
      }
    </div>
  </div>
</section>

@if (isLoginOpen()) {
  <app-login-dialog (closed)="closeLogin()" />
}
